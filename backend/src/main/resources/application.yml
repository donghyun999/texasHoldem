spring:
  application:
    name: texas-holdem-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:texas_holdem}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Seoul

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${APP_SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  tournament:
    max-active-players: ${APP_MAX_ACTIVE_PLAYERS:50}
    waiting-idle-ttl-seconds: ${APP_WAITING_IDLE_TTL_SECONDS:1800}
    in-hand-idle-ttl-seconds: ${APP_IN_HAND_IDLE_TTL_SECONDS:7200}
    action-timeout-seconds: ${APP_ACTION_TIMEOUT_SECONDS:20}
    hard-ttl-seconds: ${APP_TOURNAMENT_HARD_TTL_SECONDS:86400}
    cleanup-fixed-delay-ms: ${APP_TOURNAMENT_CLEANUP_FIXED_DELAY_MS:30000}
    cleanup-min-interval-ms: ${APP_TOURNAMENT_CLEANUP_MIN_INTERVAL_MS:15000}
    command-lock-slow-threshold-ms: ${APP_COMMAND_LOCK_SLOW_THRESHOLD_MS:150}

logging:
  level:
    root: info
    com.texasholdem: debug
